# yaml-language-server: $schema=./node_modules/@sargonpiraev/eslint-config/build/schemas/project__workflow-on-push-main.json
name: on-push-main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: on-push-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    uses: sargonpiraev/shared/.github/workflows/on-push-main.yml@main
    with:
      skip-audit: true
    secrets: inherit

  test-playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: sargonpiraev/shared/.github/actions/setup-node-npm-ci@main

      - name: Playwright spec
        run: npm run test:spec
        env:
          CI: true

      - name: Playwright visual
        run: npm run test:spec:visual
        env:
          CI: true

      - name: Playwright perf
        run: npm run test:spec:perf
        env:
          CI: true

  # CWS publish: keep out of the CI gate so expired OAuth secrets don't fail lint/test.
  # Triggered separately via release-extension.yml.
