name: on-push-main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: on-push-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    uses: sargonpiraev/ci/.github/workflows/on-push-main.yml@main
    secrets: inherit

  test-playwright:
    runs-on: ubuntu-latest
    # Keep in sync with scripts/pw-visual-docker.sh (@playwright/test version → image tag).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
      options: --user 1001
    steps:
      - uses: actions/checkout@v6

      - uses: sargonpiraev/ci/.github/actions/setup-node-npm-ci@main

      - name: Playwright suites
        run: npm run test:spec && npm run test:visual
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

  release:
    needs: [base, test-playwright]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: sargonpiraev/ci/.github/actions/setup-node-npm-ci@main

      - name: Release extension
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
