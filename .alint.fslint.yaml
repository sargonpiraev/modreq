  - ./node_modules/@sargonpiraev/fslint-config/project__apps__localproxy.yaml
  - ./node_modules/@sargonpiraev/fslint-config/project__packages__oapi-client.yaml
  - ./node_modules/@sargonpiraev/fslint-config/project__packages__db-client.yaml
  - ./node_modules/@sargonpiraev/fslint-config/project__packages__scrape-client.yaml
